<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Seni Seviyorum ❤️</title>

    <!-- PWA & Mobile Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Aşk Sayacı">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1025">
    <meta name="description" content="Ne zamandan beri sevgiliyiz?">
    <meta name="msapplication-TileColor" content="#1a1025">

    <!-- Favicon (inline heart SVG) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
    <link rel="apple-touch-icon" href="icon.jpg">

    <style>
        /* ====== CSS Reset & Base ====== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0a1a;
            --bg-secondary: #1a1025;
            --bg-card: rgba(255, 255, 255, 0.04);
            --text-primary: #f0e6ff;
            --text-secondary: #b8a5d4;
            --accent-pink: #ff6b9d;
            --accent-purple: #c084fc;
            --accent-rose: #fb7185;
            --glow-color: rgba(255, 107, 157, 0.3);
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        /* ====== Animated Background ====== */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(192, 132, 252, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 107, 157, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(251, 113, 133, 0.05) 0%, transparent 50%);
            z-index: 0;
            animation: bgShift 12s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        /* ====== Floating Particles ====== */
        .particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                opacity: 0;
                transform: translateY(-10vh) scale(1);
            }
        }

        /* ====== Main Container ====== */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem 1.5rem;
            max-width: 480px;
            width: 100%;
        }

        /* ====== Heart Icon ====== */
        .heart-wrapper {
            margin-bottom: 1.5rem;
            position: relative;
            display: inline-block;
        }

        .heart {
            font-size: 4.5rem;
            display: inline-block;
            animation: pulse 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px var(--glow-color));
            cursor: default;
            user-select: none;
            line-height: 1;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.15);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.1);
            }
            60% {
                transform: scale(1);
            }
        }

        .heart-glow {
            position: absolute;
            top: 50%; left: 50%;
            width: 120px; height: 120px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, var(--glow-color), transparent 70%);
            border-radius: 50%;
            animation: glowPulse 1.2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            15% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.3); }
            30% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            45% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.2); }
            60% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
        }

        /* ====== Couple Names ====== */
        .couple-names {
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .name {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b9d, #c084fc, #fb7185);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: nameGlow 4s ease-in-out infinite;
            letter-spacing: 0.5px;
        }

        @keyframes nameGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .name-heart {
            font-size: 1.2rem;
            animation: pulse 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 6px rgba(255, 107, 157, 0.5));
        }

        /* ====== Title ====== */
        .title {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--accent-purple);
            opacity: 0.7;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        /* ====== Timer Display ====== */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .timer-block {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 1rem 0.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .timer-block:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .timer-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }

        .timer-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0.3rem;
            font-weight: 500;
        }

        /* ====== Seconds Row (full width) ====== */
        .seconds-row {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
        }

        .seconds-block {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 107, 157, 0.15);
            border-radius: 16px;
            padding: 0.8rem 2rem;
            position: relative;
            overflow: hidden;
        }

        .seconds-block::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 157, 0.05), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .seconds-block .timer-value {
            font-size: 1.6rem;
        }

        /* ====== Total Counter ====== */
        .total-section {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .total-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.5rem;
        }

        .total-value {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent-rose);
            font-variant-numeric: tabular-nums;
        }

        /* ====== Footer Quote ====== */
        .footer-quote {
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0.5;
            font-style: italic;
            line-height: 1.5;
        }

        /* ====== Error State ====== */
        .error-message {
            background: rgba(251, 113, 133, 0.1);
            border: 1px solid rgba(251, 113, 133, 0.2);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            color: var(--accent-rose);
            font-size: 0.9rem;
            margin: 1rem 0;
            animation: fadeIn 0.5s ease;
        }

        .loading-message {
            color: var(--text-secondary);
            font-size: 1rem;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ====== Responsive ====== */
        @media (max-width: 380px) {
            .container {
                padding: 1.5rem 1rem;
            }
            .timer-value {
                font-size: 1.6rem;
            }
            .heart {
                font-size: 3.5rem;
            }
            .timer-grid {
                gap: 0.5rem;
            }
            .timer-block {
                padding: 0.8rem 0.3rem;
            }
        }

        @media (min-height: 800px) {
            .heart {
                font-size: 5.5rem;
            }
            .timer-value {
                font-size: 2.4rem;
            }
        }

        /* ====== Safe area for notched phones ====== */
        @supports (padding-top: env(safe-area-inset-top)) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
        }

        /* ====== Landscape mode ====== */
        @media (orientation: landscape) and (max-height: 500px) {
            .heart { font-size: 2.5rem; }
            .heart-wrapper { margin-bottom: 0.5rem; }
            .timer-grid { gap: 0.4rem; margin-bottom: 1rem; }
            .timer-value { font-size: 1.4rem; }
            .timer-block { padding: 0.5rem 0.3rem; border-radius: 10px; }
            .container { padding: 0.8rem 1rem; }
            .subtitle { margin-bottom: 0.8rem; }
            .total-section { padding: 0.7rem 1rem; margin-bottom: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- Heart -->
        <div class="heart-wrapper">
            <div class="heart-glow"></div>
            <div class="heart" aria-label="Kalp">❤️</div>
        </div>

        <!-- Title -->
        <div class="couple-names">
            <span class="name">Ramazan</span>
            <span class="name-heart">❤️</span>
            <span class="name">Zilan</span>
        </div>
        <p class="title">Seninle geçen her an…</p>
        <p class="subtitle" id="startDateText">yükleniyor…</p>

        <!-- Timer Grid -->
        <div class="timer-grid" id="timerGrid">
            <div class="timer-block">
                <div class="timer-value" id="years">-</div>
                <div class="timer-label">Yıl</div>
            </div>
            <div class="timer-block">
                <div class="timer-value" id="months">-</div>
                <div class="timer-label">Ay</div>
            </div>
            <div class="timer-block">
                <div class="timer-value" id="days">-</div>
                <div class="timer-label">Gün</div>
            </div>
            <div class="timer-block">
                <div class="timer-value" id="hours">-</div>
                <div class="timer-label">Saat</div>
            </div>
            <div class="timer-block">
                <div class="timer-value" id="minutes">-</div>
                <div class="timer-label">Dakika</div>
            </div>
            <div class="timer-block">
                <div class="timer-value" id="seconds">-</div>
                <div class="timer-label">Saniye</div>
            </div>
        </div>

        <!-- Total Days -->
        <div class="total-section">
            <div class="total-label">Toplam Birlikte Geçen</div>
            <div class="total-value" id="totalDays">hesaplanıyor…</div>
        </div>

        <!-- Footer -->
        <p class="footer-quote">"Seni sevmek, zamanı unutmaktır."</p>
    </div>

    <script>
    (function () {
        'use strict';

        // ═══════════════════════════════════════════════
        //  CONFIG — Başlangıç tarihini buradan değiştir
        // ═══════════════════════════════════════════════
        const START_DATE_STRING = '2025-09-15T16:30:00';

        // ═══════════════════════════════════════════════
        //  DOM References
        // ═══════════════════════════════════════════════
        const els = {
            years:    document.getElementById('years'),
            months:   document.getElementById('months'),
            days:     document.getElementById('days'),
            hours:    document.getElementById('hours'),
            minutes:  document.getElementById('minutes'),
            seconds:  document.getElementById('seconds'),
            totalDays:    document.getElementById('totalDays'),
            startDateText: document.getElementById('startDateText'),
            timerGrid:     document.getElementById('timerGrid'),
        };

        let intervalId = null;

        // ═══════════════════════════════════════════════
        //  PARTICLES — Floating background hearts
        // ═══════════════════════════════════════════════
        function createParticles() {
            try {
                const container = document.getElementById('particles');
                const count = window.innerWidth < 600 ? 10 : 18;
                const symbols = ['♥', '♡', '✦', '·'];

                for (let i = 0; i < count; i++) {
                    const el = document.createElement('span');
                    el.className = 'particle';
                    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                    el.style.left = Math.random() * 100 + '%';
                    el.style.fontSize = (Math.random() * 14 + 6) + 'px';
                    el.style.color = Math.random() > 0.5
                        ? 'rgba(255, 107, 157, 0.4)'
                        : 'rgba(192, 132, 252, 0.3)';
                    el.style.animationDuration = (Math.random() * 12 + 10) + 's';
                    el.style.animationDelay = (Math.random() * 15) + 's';
                    container.appendChild(el);
                }
            } catch (_) {
                // Particles are decorative; silently ignore errors
            }
        }

        // ═══════════════════════════════════════════════
        //  DATE PARSING & VALIDATION
        // ═══════════════════════════════════════════════
        function parseStartDate(dateStr) {
            if (!dateStr || typeof dateStr !== 'string') {
                throw new Error('Tarih değeri bulunamadı.');
            }

            const d = new Date(dateStr);

            if (isNaN(d.getTime())) {
                throw new Error('Geçersiz tarih formatı: "' + dateStr + '"');
            }

            if (d.getTime() > Date.now()) {
                throw new Error('Başlangıç tarihi gelecekte olamaz.');
            }

            return d;
        }

        // ═══════════════════════════════════════════════
        //  PRECISE DIFFERENCE CALCULATION
        //  Accounts for varying month lengths & leap years
        // ═══════════════════════════════════════════════
        function getDaysInMonth(year, month) {
            // month is 0-indexed (0 = Jan, 11 = Dec)
            return new Date(year, month + 1, 0).getDate();
        }

        function calcDiff(start, now) {
            let years  = now.getFullYear()  - start.getFullYear();
            let months = now.getMonth()     - start.getMonth();
            let days   = now.getDate()      - start.getDate();
            let hours  = now.getHours()     - start.getHours();
            let mins   = now.getMinutes()   - start.getMinutes();
            let secs   = now.getSeconds()   - start.getSeconds();

            // Propagate borrows from seconds → minutes → hours → days → months → years
            if (secs < 0) {
                secs += 60;
                mins--;
            }
            if (mins < 0) {
                mins += 60;
                hours--;
            }
            if (hours < 0) {
                hours += 24;
                days--;
            }
            if (days < 0) {
                // Borrow one month: use the number of days in the *previous* month
                const prevMonth = (now.getMonth() - 1 + 12) % 12;
                const prevMonthYear = now.getMonth() === 0
                    ? now.getFullYear() - 1
                    : now.getFullYear();
                days += getDaysInMonth(prevMonthYear, prevMonth);
                months--;
            }
            if (months < 0) {
                months += 12;
                years--;
            }

            // Total days (integer)
            const msPerDay = 86400000;
            const totalDays = Math.floor((now.getTime() - start.getTime()) / msPerDay);

            return { years, months, days, hours, mins, secs, totalDays };
        }

        // ═══════════════════════════════════════════════
        //  FORMAT HELPERS
        // ═══════════════════════════════════════════════
        function pad(n) {
            return String(n).padStart(2, '0');
        }

        function formatTotalDays(totalDays) {
            return totalDays.toLocaleString('tr-TR') + ' gün, '
                 + (totalDays * 24).toLocaleString('tr-TR') + '+ saat';
        }

        function formatStartDate(d) {
            const months = [
                'Ocak','Şubat','Mart','Nisan','Mayıs','Haziran',
                'Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'
            ];
            return d.getDate() + ' ' + months[d.getMonth()] + ' '
                 + d.getFullYear() + '\'den beri ❤️';
        }

        // ═══════════════════════════════════════════════
        //  UI UPDATE
        // ═══════════════════════════════════════════════
        function updateUI(startDate) {
            try {
                const now = new Date();

                if (isNaN(now.getTime())) {
                    throw new Error('Sistem saati okunamıyor.');
                }

                const diff = calcDiff(startDate, now);

                els.years.textContent   = diff.years;
                els.months.textContent  = diff.months;
                els.days.textContent    = diff.days;
                els.hours.textContent   = pad(diff.hours);
                els.minutes.textContent = pad(diff.mins);
                els.seconds.textContent = pad(diff.secs);
                els.totalDays.textContent = formatTotalDays(diff.totalDays);
            } catch (err) {
                showError(err.message);
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
            }
        }

        // ═══════════════════════════════════════════════
        //  ERROR DISPLAY
        // ═══════════════════════════════════════════════
        function showError(message) {
            els.timerGrid.innerHTML =
                '<div class="error-message" style="grid-column:1/-1">' +
                '⚠️ ' + escapeHTML(message) +
                '</div>';
            els.totalDays.textContent = '—';
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ═══════════════════════════════════════════════
        //  INIT
        // ═══════════════════════════════════════════════
        function init() {
            try {
                const startDate = parseStartDate(START_DATE_STRING);
                els.startDateText.textContent = formatStartDate(startDate);

                // First render immediately
                updateUI(startDate);

                // Then update every second
                intervalId = setInterval(function () {
                    updateUI(startDate);
                }, 1000);

            } catch (err) {
                showError(err.message);
                els.startDateText.textContent = 'tarih okunamadı';
            }

            createParticles();
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
